<!--
title: Vinted, Leboncoin : dois-je déclarer mes ventes ? Simulateur gratuit
description: Calcule en 30 secondes si Vinted, Leboncoin, eBay ou Etsy vont transmettre tes ventes au fisc (seuils DAC7 : 30 ventes ou 2 000 €) et ce que tu dois vraiment déclarer.
hero: Tous les outils | Ta plateforme va-t-elle te déclarer au fisc ? | Entre tes ventes de l'année. Tu sais en 30 secondes si tu es concerné, et ce que ça change vraiment pour toi.
script: declaration.js
-->
<div class="wrap panel-wrap"><div class="panel">
  <div class="block">
    <h2><span class="step">1</span>Tes ventes de l'année</h2>
    <p class="sub">Les seuils se comptent plateforme par plateforme. Laisse à 0 celles que tu n'utilises pas.</p>
    <div id="platforms"></div>
  </div>
  <div class="block">
    <h2><span class="step">2</span>Que vends-tu ?</h2>
    <div class="seg" role="radiogroup" aria-label="Type de vente">
      <input type="radio" name="profile" id="p-perso" value="perso" checked>
      <label for="p-perso">Mes affaires<small>vêtements, objets utilisés</small></label>
      <input type="radio" name="profile" id="p-resale" value="resale">
      <label for="p-resale">J'achète pour revendre<small>pour faire une marge</small></label>
    </div>
    <div id="resaleFields" hidden>
      <label class="lbl" style="margin-top:14px">Mes achats de l'année (€)
        <input type="number" id="purchases" min="0" step="1" value="0" inputmode="decimal"></label>
    </div>
  </div>
  <div class="block result" id="result" aria-live="polite"></div>
</div></div>
